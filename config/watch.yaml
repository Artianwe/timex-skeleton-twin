# =====================================================================================
#  CENTRAL PARAMETER DATABASE — Timex TWEG16716 "Full Skeleton Automatic" digital twin
#  Author: Anwesh Ajitabh Dash
# =====================================================================================
#
#  Every physical parameter is a leaf of the form
#      name: {value: <number>, unit: <unit>, prov: <provenance>, src: <source / rationale>,
#             range: [min, max]  # optional plausible range used by sensitivity / Monte-Carlo
#            }
#  Values are written in convenient engineering units and converted to SI by twin.params.
#
#  PROVENANCE (prov) — strictly one of:
#    measured : observed on the owner's watch (engraving, photo, photogrammetry)
#    sourced  : manufacturer / reference documentation (Miyota spec sheet, parts list, etc.)
#    inferred : derived from measured/sourced data through a stated constraint or physics
#    assumed  : engineering estimate typical for this class of movement (configurable!)
#  "VERIFIED" = measured or sourced.   "ESTIMATED" = inferred-from-assumptions or assumed.
#
#  Caliber identification (see docs/01_identification.md): Miyota (Citizen) Cal. 82S0 —
#  stated by the owner, consistent with photos (balance under open heart at ~7:30 dial view,
#  21 jewels, central H/M/S, no date) and with Miyota's official 82S0 documents.
#
#  Frames: DIAL VIEW, x -> 3 o'clock (crown), y -> 12 o'clock, z -> toward the dial/viewer.
#          z = 0 at the dial-side face of the main plate; bridges/rotor are at negative z.
#          Angles in the plane are counter-clockwise from 3 o'clock (dial view).
# =====================================================================================

meta:
  title: "Digital twin of Timex TWEG16716 (Miyota 82S0, 21,600 vph Swiss-lever automatic)"
  author: "Anwesh Ajitabh Dash"
  version: "1.0.0"

identification:
  watch_reference: "TWEG16716-E5 (Timex E-Class Full Skeleton Automatic)"
  watch_reference_source: "Caseback engraving 'TW?G16716-E5' (partly obscured) + retailer listings"
  caliber: "Miyota 82S0 (Citizen Watch Mfg.), 11 1/2 ligne, open heart"
  caliber_source: "Owner statement + Miyota 82S0 spec sheet / parts list; photo evidence consistent"
  caliber_confidence: "high"
  caliber_notes: "82S0 and skeleton sibling 8N24 share balance 039-102, escape wheel 032-106, pallet fork 035-560, 3rd/4th wheels and barrel 001-870, so the dynamic model is identical for both."
  architecture: "Mechanical self-winding (unidirectional central rotor) + hand winding, hacking, Swiss lever escapement, indirect centre seconds"

